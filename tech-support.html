<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>孝心平安通 - 技术支持</title>
  <style>
    :root { --bg:#f7f8fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --brand:#0f766e; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:900px; margin:0 auto; padding:24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; }
    h1 { margin:0 0 8px; font-size:28px; }
    h2 { margin:24px 0 10px; font-size:20px; }
    p, li { line-height:1.75; }
    .meta { color:var(--muted); font-size:14px; }
    .contact { background:#f0fdfa; border:1px solid #99f6e4; border-radius:12px; padding:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>孝心平安通技术支持</h1>
      <p class="meta">更新时间：2026-04-23</p>

      <h2>常见问题</h2>
      <ul>
        <li>无法读取联系人：请检查系统设置中是否已允许“通讯录”权限。</li>
        <li>语音播报无声音：请确认系统音量、静音状态及应用内语音开关。</li>
        <li>联系人头像或号码编辑后未生效：请返回首页下拉刷新或重新进入应用。</li>
      </ul>

      <h2>联系我们</h2>
      <div class="contact">
        <p>支持邮箱：support@example.com</p>
        <p>工作时间：周一至周五 09:00 - 18:00（GMT+8）</p>
      </div>

      <h2>反馈建议</h2>
      <p>欢迎提交您对孝心平安通的建议，我们会持续优化产品体验。</p>
    </div>
  </div>
</body>
</html>
